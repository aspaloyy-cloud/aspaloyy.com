<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aspaloyy &ndash; Settings</title>
    <link rel="stylesheet" href="assets/style.css" />
    <script defer src="assets/script.js"></script>
  </head>
  <body>
    <nav>
      <div class="logo"><a href="index.html">Aspaloyy</a></div>
      <button id="menu-button" aria-label="Toggle menu">&#9776;</button>
      <div id="nav-links" class="nav-links">
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="news.html">News</a>
        <a href="status.html">Status</a>
        <a href="settings.html">Settings</a>
        <a href="about.html">About</a>
        <label class="theme-switch" title="Toggle dark mode">
          <input type="checkbox" id="theme-toggle" />
          <span>Dark&nbsp;Mode</span>
        </label>
      </div>
    </nav>

    <section class="page-title">
      <h1>Site Settings</h1>
      <p>
        Configure your experience on Aspaloyy. All settings are lightweight
        toggles that persist locally. Nothing here clutters the interface.
      </p>
    </section>

    <div class="settings-container">
      <div class="settings-section">
        <h2>Theme</h2>
        <label for="theme-toggle-settings">
          <span>Enable dark mode</span>
          <input type="checkbox" id="theme-toggle-settings" />
        </label>
      </div>
      <div class="settings-section">
        <h2>Notifications</h2>
        <label for="email-notify">
          <span>Email notifications</span>
          <input type="checkbox" id="email-notify" />
        </label>
        <label for="push-notify">
          <span>Push notifications</span>
          <input type="checkbox" id="push-notify" />
        </label>
      </div>
      <div class="settings-section">
        <h2>Interface</h2>
        <label for="compact-mode">
          <span>Enable compact layout</span>
          <input type="checkbox" id="compact-mode" />
        </label>
        <label for="animations-toggle">
          <span>Reduced motion</span>
          <input type="checkbox" id="animations-toggle" />
        </label>
      </div>
      <button class="save-btn" id="save-settings">Save Settings</button>
    </div>

    <footer>
      <p>&copy; 2026 Aspaloyy. All rights reserved.</p>
    </footer>

    <script>
      // Additional settings-specific script to handle synchronising the theme toggle
      document.addEventListener('DOMContentLoaded', () => {
        // Mirror main theme switch state into settings switch
        const themeToggleMain = document.getElementById('theme-toggle');
        const themeToggleSettings = document.getElementById('theme-toggle-settings');
        const storedTheme = localStorage.getItem('aspaloyy-theme');
        if (storedTheme === 'dark') {
          themeToggleSettings.checked = true;
        }
        if (themeToggleSettings) {
          themeToggleSettings.addEventListener('change', () => {
            // Trigger click on main toggle so core script updates theme and storage
            if (themeToggleMain) {
              themeToggleMain.checked = themeToggleSettings.checked;
              themeToggleMain.dispatchEvent(new Event('change'));
            }
          });
        }

        // Basic settings persistence using localStorage for demonstration.
        const settingsIds = ['email-notify', 'push-notify', 'compact-mode', 'animations-toggle'];
        // Initialise from localStorage
        settingsIds.forEach(id => {
          const el = document.getElementById(id);
          if (!el) return;
          const storedVal = localStorage.getItem('aspaloyy-' + id);
          el.checked = storedVal === 'true';
        });
        document.getElementById('save-settings').addEventListener('click', () => {
          // Save current values
          settingsIds.forEach(id => {
            const el = document.getElementById(id);
            localStorage.setItem('aspaloyy-' + id, el.checked);
          });
          alert('Settings saved locally.');
        });
      });
    </script>
  </body>
</html>
