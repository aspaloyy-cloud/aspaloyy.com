<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Асман Рахманов</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        darkbg: '#0f1115',
                        cardbg: '#161922',
                        bordercolor: '#262b36',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="bg-darkbg text-zinc-100 font-sans antialiased min-h-screen flex flex-col selection:bg-zinc-700 selection:text-white">

    <!-- Header Navigation -->
    <header class="border-b border-bordercolor bg-darkbg/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-2xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="font-semibold text-white tracking-tight hover:text-zinc-300 transition-colors">
                Асман Рахманов
            </a>
            <nav class="flex items-center gap-6 text-sm text-zinc-400">
                <a href="index.html" class="text-white font-medium">Лента</a>
                <a href="about.html" class="hover:text-white transition-colors">Обо мне</a>
                <a href="projects.html" class="hover:text-white transition-colors">Проекты</a>
                <a href="contact.html" class="hover:text-white transition-colors">Контакты</a>
            </nav>
        </div>
    </header>

    <!-- Main Content: Feed -->
    <main class="max-w-2xl mx-auto px-6 py-8 flex-grow w-full">
        
        <!-- New Post Creator Box -->
        <section class="bg-cardbg border border-bordercolor rounded-xl p-4 mb-8 shadow-sm">
            <h2 class="text-xs font-mono uppercase tracking-wider text-zinc-400 mb-3">Новая запись</h2>
            <form id="post-form" class="space-y-3">
                <textarea id="post-content" rows="3" placeholder="Что происходит в разработке..." class="w-full bg-darkbg border border-bordercolor rounded-lg p-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-500 resize-none"></textarea>
                <div class="flex justify-between items-center">
                    <span class="text-xs text-zinc-600 font-mono">Markdown поддерживается</span>
                    <button type="submit" class="bg-white text-black font-medium text-xs px-4 py-2 rounded-lg hover:bg-zinc-200 transition-colors">
                        Опубликовать
                    </button>
                </div>
            </form>
        </section>

        <!-- Feed Stream -->
        <section class="space-y-4">
            <h2 class="text-xs font-mono uppercase tracking-wider text-zinc-400 mb-4">Лента активности</h2>
            <div id="feed-container" class="space-y-4">
                <!-- Dynamic posts will be inserted here -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="border-t border-bordercolor py-6 text-center text-xs text-zinc-600 font-mono">
        <p>© 2026 Асман Рахманов. Все права защищены.</p>
    </footer>

    <script>
        // Default initial posts
        const defaultPosts = [
            {
                id: 1,
                author: "Асман Рахманов",
                date: "20 ноября 2026",
                content: "Завершил настройку консенсуса в распределенном модуле логирования. Переходим к тестированию под сетевой нагрузкой и симуляцией потери пакетов.",
                comments: [
                    { author: "Иван", text: "Какая библиотека для gRPC используется?" },
                    { author: "Асман Рахманов", text: "Стандартная google.golang.org/grpc + protobuf." }
                ]
            },
            {
                id: 2,
                author: "Асман Рахманов",
                date: "18 ноября 2026",
                content: "Рефакторинг старых утилит на Rust. Управление памятью без GC дает предсказуемые тайминги на тяжелых структурах данных.",
                comments: []
            }
        ];

        function getPosts() {
            const saved = localStorage.getItem('aspaloyy_posts');
            if (!saved) {
                localStorage.setItem('aspaloyy_posts', JSON.stringify(defaultPosts));
                return defaultPosts;
            }
            return JSON.parse(saved);
        }

        function savePosts(posts) {
            localStorage.setItem('aspaloyy_posts', JSON.stringify(posts));
        }

        function renderFeed() {
            const container = document.getElementById('feed-container');
            const posts = getPosts();
            
            container.innerHTML = posts.map(post => `
                <article class="bg-cardbg border border-bordercolor rounded-xl p-5 space-y-3">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center font-bold text-xs text-zinc-300">АР</div>
                            <div>
                                <h3 class="text-sm font-semibold text-white">${post.author}</h3>
                                <span class="text-xs text-zinc-500 font-mono">${post.date}</span>
                            </div>
                        </div>
                    </div>
                    <p class="text-sm text-zinc-300 leading-relaxed whitespace-pre-wrap">${escapeHtml(post.content)}</p>
                    
                    <!-- Comments section -->
                    <div class="border-t border-bordercolor/60 pt-3 mt-3 space-y-2">
                        <div class="space-y-2">
                            ${post.comments.map(c => `
                                <div class="bg-darkbg/50 border border-bordercolor/40 rounded-lg p-2.5 text-xs">
                                    <span class="font-semibold text-zinc-300">${escapeHtml(c.author)}:</span> 
                                    <span class="text-zinc-400">${escapeHtml(c.text)}</span>
                                </div>
                            `).join('')}
                        </div>
                        
                        <!-- Add comment form -->
                        <form onsubmit="addComment(event, ${post.id})" class="flex gap-2 mt-2">
                            <input type="text" placeholder="Ваше имя" name="comment_author" required class="w-1/3 bg-darkbg border border-bordercolor rounded-lg px-2.5 py-1.5 text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-500">
                            <input type="text" placeholder="Написать комментарий..." name="comment_text" required class="flex-grow bg-darkbg border border-bordercolor rounded-lg px-2.5 py-1.5 text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-500">
                            <button type="submit" class="bg-zinc-800 text-zinc-300 hover:text-white px-3 py-1.5 rounded-lg text-xs font-medium transition-colors">Отправить</button>
                        </form>
                    </div>
                </article>
            `).join('');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        document.getElementById('post-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const content = document.getElementById('post-content').value.trim();
            if (!content) return;

            const posts = getPosts();
            const newPost = {
                id: Date.now(),
                author: "Асман Рахманов",
                date: new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }),
                content: content,
                comments: []
            };

            posts.unshift(newPost);
            savePosts(posts);
            document.getElementById('post-content').value = '';
            renderFeed();
        });

        function addComment(event, postId) {
            event.preventDefault();
            const form = event.target;
            const author = form.comment_author.value.trim();
            const text = form.comment_text.value.trim();
            if (!author || !text) return;

            const posts = getPosts();
            const post = posts.find(p => p.id === postId);
            if (post) {
                post.comments.push({ author, text });
                savePosts(posts);
                renderFeed();
            }
        }

        renderFeed();
    </script>
</body>
</html>
