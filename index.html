<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aspaloyy</title>
  <meta name="description" content="Android developer from Kyrgyzstan. Mobile games and apps on Google Play.">
  <meta name="theme-color" content="#0d1117">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-brand"><span class="status-dot" aria-hidden="true"></span>Aspaloyy</a>
    <ul class="nav-links">
      <li><a href="apps/" data-i18n="nav.apps">Приложения</a></li>
      <li><a href="about/" data-i18n="nav.about">Обо мне</a></li>
    </ul>
    <div class="nav-controls">
      <select id="langSelect" class="nav-btn" aria-label="Language">
        <option value="ru">RU</option>
        <option value="en">EN</option>
        <option value="ky">KY</option>
        <option value="tr">TR</option>
        <option value="de">DE</option>
      </select>
      <button id="theme-toggle" class="nav-btn" aria-label="Toggle theme">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
  </div>
</nav>

<main>
  <div class="wrap">
    <section class="hero">
      <code class="hero-path">$ ~/aspaloyy</code>
      <h1 class="hero-name">Aspaloyy</h1>
      <p class="hero-tagline" data-i18n="home.tagline">Android-разработчик из Кыргызстана.</p>
      <div class="hero-actions">
        <a href="apps/" class="btn" data-i18n="home.cta1">Приложения →</a>
        <a href="about/" class="btn" data-i18n="home.cta2">Обо мне →</a>
      </div>
      <div class="hero-panel">
        <div class="hero-panel-head" data-i18n="nav.apps">Приложения</div>
        <a href="apps/" class="shelf-row">
          <span class="shelf-icon" aria-hidden="true">🎮</span>
          <span class="shelf-name">Span It</span>
          <span class="shelf-tag">game</span>
        </a>
        <a href="apps/" class="shelf-row">
          <span class="shelf-icon" aria-hidden="true">🧮</span>
          <span class="shelf-name">Calculator</span>
          <span class="shelf-tag">utility</span>
        </a>
      </div>
    </section>
  </div>
</main>

<footer class="footer">
  <div class="wrap">
    <p class="footer-text">© 2026 Aspaloyy</p>
  </div>
</footer>

<script src="js/i18n.js"></script>
<script src="js/app.js" defer></script>
</body>
</html>
